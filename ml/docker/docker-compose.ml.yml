version: '3.8'

services:
  # PostgreSQLデータベース（MLサービス専用）
  postgres-ml:
    image: postgres:15
    container_name: congestion-watch-postgres-ml
    environment:
      POSTGRES_DB: congestion_watch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_ml_data:/var/lib/postgresql/data
      - ../../database/docker/01-init-database.sql:/docker-entrypoint-initdb.d/01-init-database.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MLサービス（FastAPI + スケジューラー）
  ml-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: congestion-watch-ml-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-ml:5432/congestion_watch
      - ML_PORT=8001
      - ENV=production
      - AUTO_START_SCHEDULER=true
      - LOG_LEVEL=INFO
      - MODEL_DIR=/app/models
      - MODEL_RETRAIN_HOUR=12
      - PREDICTION_INTERVAL_MINUTES=5
    volumes:
      - ml_models:/app/models
      - ml_logs:/app/logs
    ports:
      - "8001:8001"
    depends_on:
      postgres-ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_ml_data:
    driver: local
  ml_models:
    driver: local
  ml_logs:
    driver: local

networks:
  default:
    name: congestion-watch-ml-network